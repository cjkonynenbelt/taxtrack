<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TaxTrack</title>
  <meta name="description" content="Private business expense, mileage and tax records for self-employed work in Canada. Estimates only.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TaxTrack">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" hidden>
    <header class="top">
      <a class="brand" href="#/home"><span class="brand-mark" aria-hidden="true"></span>TaxTrack</a>
      <div class="top-right">
        <a class="top-link" href="#/reminders" aria-label="Reminders">Reminders<span class="count" data-count hidden></span></a>
        <select id="year" aria-label="Tax year"></select>
      </div>
    </header>

    <nav class="side" aria-label="Sections"></nav>

    <main><div id="live" hidden></div><div id="view"></div></main>

    <nav class="bottom" aria-label="Main">
      <a href="#/home" data-tab="home">Home</a>
      <a href="#/expenses" data-tab="expenses">Expenses</a>
      <button type="button" class="fab" data-add aria-label="Add a record">+</button>
      <a href="#/trips" data-tab="trips">Mileage</a>
      <a href="#/more" data-tab="more">More</a>
    </nav>
  </div>
  <noscript><p style="padding:24px">TaxTrack needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
